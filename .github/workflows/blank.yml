name: Build and Package JAR

on:
  push:
    branches:
      - main  # 触发主分支推送时执行
  pull_request:
    branches:
      - main  # 触发主分支PR时执行

jobs:
  build:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # 检出仓库代码

    - name: Set up JDK  # 配置JDK环境
      uses: actions/setup-java@v2
      with:
        java-version: '11'  # 使用Java 11，你可以根据项目需求修改

    - name: Build with Gradle  # 使用Gradle构建项目
      run: ./gradlew build  # 这里假设你的项目使用Gradle构建，如果是Maven可以使用mvn命令

    - name: Package JAR  # 打包JAR文件
      run: ./gradlew assemble  # 使用Gradle的assemble任务打包JAR文件

    - name: Upload JAR Artifact  # 上传JAR文件作为构建产物
      uses: actions/upload-artifact@v2
      with:
        name: my-java-app  # 构建产物的名称，可自定义
        path: path/to/your/jar/file.jar  # JAR文件的路径，根据你的项目路径修改
